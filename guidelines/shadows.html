<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Card, float, option and pill shadows" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff}*{box-sizing:border-box}</style></head><body><div style="padding:28px;display:flex;gap:24px;background:var(--paper)"><div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">--shadow-card</div><div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:var(--shadow-float);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">--shadow-float</div><div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:var(--shadow-option);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">--shadow-option</div><div style="flex:1;height:100px;background:#fff;border-radius:12px;box-shadow:var(--shadow-pill);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-muted)">--shadow-pill</div></div></body></html>
