<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:12px;padding:20px;background:#fff"><div style="flex:1;min-width:0"><div style="height:72px;border-radius:10px;background:var(--mist-300);border:1px solid rgba(10,21,48,.08)"></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--text-strong)">Mist 300</div><div style="font-size:11px;color:var(--text-muted)">--mist-300<br>#D9D9D9</div></div><div style="flex:1;min-width:0"><div style="height:72px;border-radius:10px;background:var(--mist-200);border:1px solid rgba(10,21,48,.08)"></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--text-strong)">Mist 200</div><div style="font-size:11px;color:var(--text-muted)">--mist-200<br>#E6E6E6</div></div><div style="flex:1;min-width:0"><div style="height:72px;border-radius:10px;background:var(--paper);border:1px solid rgba(10,21,48,.08)"></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--text-strong)">Paper</div><div style="font-size:11px;color:var(--text-muted)">--paper<br>#F7F5F3</div></div><div style="flex:1;min-width:0"><div style="height:72px;border-radius:10px;background:var(--slate-500);border:1px solid rgba(10,21,48,.08)"></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--text-strong)">Slate 500</div><div style="font-size:11px;color:var(--text-muted)">--slate-500<br>#6B7486</div></div><div style="flex:1;min-width:0"><div style="height:72px;border-radius:10px;background:var(--white);border:1px solid rgba(10,21,48,.08)"></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--text-strong)">White</div><div style="font-size:11px;color:var(--text-muted)">--white<br>#FFFFFF</div></div></div></body></html>
