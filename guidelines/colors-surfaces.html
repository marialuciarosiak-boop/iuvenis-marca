<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px;padding:20px"><div style="flex:1;height:110px;border-radius:10px;background:var(--bg-brand);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff"><b style="font-size:13px">Brand</b><span style="font-size:10px;opacity:.85">--bg-brand</span></div><div style="flex:1;height:110px;border-radius:10px;background:var(--bg-deep);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff"><b style="font-size:13px">Deep</b><span style="font-size:10px;opacity:.85">--bg-deep</span></div><div style="flex:1;height:110px;border-radius:10px;background:var(--bg-premium);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--gold-500)"><b style="font-size:13px">Premium</b><span style="font-size:10px;opacity:.85">--bg-premium</span></div><div style="flex:1;height:110px;border-radius:10px;background:var(--bg-neutral);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--petrol-900)"><b style="font-size:13px">Neutral</b><span style="font-size:10px;opacity:.85">--bg-neutral</span></div><div style="flex:1;height:110px;border-radius:10px;background:var(--bg-app);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--navy-800)"><b style="font-size:13px">App</b><span style="font-size:10px;opacity:.85">--bg-app</span></div></div></body></html>
